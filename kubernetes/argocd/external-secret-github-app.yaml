# GitHub App credentials for private repos (org-level).
# Populate AWS SM secret lla-rke2-cs2/argocd/github-app — see docs/GITHUB-APP-ARGOCD.md
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-github-app-repos
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: github-app-repos
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: git
        url: "{{ .url }}"
        githubAppID: "{{ .githubAppID }}"
        githubAppInstallationID: "{{ .githubAppInstallationID }}"
        githubAppPrivateKey: "{{ .githubAppPrivateKey }}"
  dataFrom:
    - extract:
        key: lla-rke2-cs2/argocd/github-app
