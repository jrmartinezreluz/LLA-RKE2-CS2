apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
  - ingress.yaml

patches:
  - path: argocd-cmd-params-cm.yaml

# Do not add global labels to upstream install.yaml resources: Argo CD watches
# ConfigMaps/Secrets with label app.kubernetes.io/part-of=argocd.
