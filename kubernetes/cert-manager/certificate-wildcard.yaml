apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lla-internal-wildcard
  namespace: traefik
spec:
  secretName: lla-internal-wildcard-tls
  duration: 2160h # 90d
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: lla-internal-ca
    kind: ClusterIssuer
  dnsNames:
    - lla.internal
    - "*.lla.internal"
