# Custom Grafana dashboards — auto-loaded by Grafana sidecar (searchNamespace: ALL).
# Apply: kubectl apply -f kubernetes/monitoring/grafana-dashboards/
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-lla-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: LLA Monitoring
data:
  lla-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "options": { "0": { "color": "red", "text": "DOWN" }, "1": { "color": "green", "text": "UP" } }, "type": "value" }
              ],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "id": 1,
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "title": "Nodos Ready",
          "type": "stat",
          "targets": [{ "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "id": 2,
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "title": "Pods totales",
          "type": "stat",
          "targets": [{ "expr": "count(kube_pod_info)", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "options": { "0": { "color": "red", "text": "FAIL" }, "1": { "color": "green", "text": "OK" } }, "type": "value" }
              ],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "id": 3,
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "title": "Sintéticos OK",
          "type": "stat",
          "targets": [{ "expr": "sum(probe_success{job=~\"blackbox.*\"})", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "id": 4,
          "options": { "colorMode": "value", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "title": "Pods CrashLoopBackOff",
          "type": "stat",
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] }
            }
          },
          "targets": [{ "expr": "count(kube_pod_container_status_waiting_reason{reason=\"CrashLoopBackOff\"} == 1) or vector(0)", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "id": 5,
          "options": { "legend": { "displayMode": "table", "placement": "bottom" } },
          "title": "Sintéticos — probe_success (1=OK)",
          "type": "timeseries",
          "targets": [{ "expr": "probe_success{job=~\"blackbox.*\"}", "legendFormat": "{{instance}} ({{tier}})", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "id": 6,
          "options": { "legend": { "displayMode": "table", "placement": "bottom" } },
          "title": "Sintéticos — latencia (s)",
          "type": "timeseries",
          "targets": [{ "expr": "probe_duration_seconds{job=~\"blackbox.*\"}", "legendFormat": "{{instance}}", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "id": 7,
          "options": { "legend": { "displayMode": "table", "placement": "bottom" } },
          "title": "CPU por namespace (cores)",
          "type": "timeseries",
          "targets": [{ "expr": "sum(rate(container_cpu_usage_seconds_total{container!=\"\",image!=\"\"}[5m])) by (namespace)", "legendFormat": "{{namespace}}", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "id": 8,
          "options": { "legend": { "displayMode": "table", "placement": "bottom" } },
          "title": "Memoria por namespace (GiB)",
          "type": "timeseries",
          "targets": [{ "expr": "sum(container_memory_working_set_bytes{container!=\"\",image!=\"\"}) by (namespace) / 1024 / 1024 / 1024", "legendFormat": "{{namespace}}", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 20 },
          "id": 9,
          "options": { "showHeader": true, "sortBy": [{ "desc": false, "displayName": "instance" }] },
          "title": "Estado sintéticos (actual)",
          "type": "table",
          "targets": [{ "expr": "probe_success{job=~\"blackbox.*\"}", "format": "table", "instant": true, "refId": "A" }],
          "transformations": [
            { "id": "organize", "options": { "excludeByName": { "Time": true, "__name__": true, "job": true }, "renameByName": { "Value": "success", "instance": "endpoint", "tier": "tier" } } }
          ]
        }
      ],
      "schemaVersion": 39,
      "tags": ["lla", "overview", "synthetics"],
      "time": { "from": "now-1h", "to": "now" },
      "title": "LLA - Cluster & Synthetics Overview",
      "uid": "lla-overview",
      "version": 1
    }
