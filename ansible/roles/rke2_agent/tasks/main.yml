---
- name: Update apt cache and upgrade packages
  apt:
    update_cache: true
    upgrade: dist

- name: Install required packages
  apt:
    name:
      - curl
      - wget
      - apt-transport-https
      - gnupg
      - lsb-release
      - software-properties-common
    state: present

- name: Load kernel modules for Kubernetes
  modprobe:
    name: "{{ item }}"
  loop:
    - overlay
    - br_netfilter

- name: Persist kernel modules
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"

- name: Configure sysctl for Kubernetes
  copy:
    dest: /etc/sysctl.d/99-kubernetes-cri.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
      vm.overcommit_memory = 1
      kernel.panic = 10
      kernel.panic_on_oops = 1
    mode: "0644"

- name: Apply sysctl settings
  command: sysctl --system
  changed_when: false

- name: Disable swap
  command: swapoff -a
  changed_when: false

- name: Remove swap from fstab
  replace:
    path: /etc/fstab
    regexp: '^([^#].* swap .*)$'
    replace: '# \1'

- name: Install RKE2 agent
  shell: curl -sfL https://get.rke2.io | INSTALL_RKE2_TYPE=agent sh -
  args:
    creates: /usr/local/bin/rke2

- name: Ensure RKE2 config directory exists
  file:
    path: /etc/rancher/rke2
    state: directory
    mode: "0755"

- name: Validate cluster token is set
  assert:
    that:
      - cluster_token | length > 0
    fail_msg: >-
      Set RKE2_CLUSTER_TOKEN (export from master1 node-token) before running worker playbook.

- name: Write cluster join token
  copy:
    dest: /etc/rancher/rke2/token-secret
    content: "{{ cluster_token }}"
    mode: "0600"

- name: Deploy RKE2 agent config
  template:
    src: config.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    mode: "0644"
  notify: Restart rke2 agent

- name: Enable and start RKE2 agent
  systemd:
    name: rke2-agent.service
    enabled: true
    state: started

- name: Ensure kubectl is available in PATH
  file:
    src: /var/lib/rancher/rke2/bin/kubectl
    dest: /usr/local/bin/kubectl
    state: link
    force: true
